name: OWASP ZAP Integration with GitHub Actions

on: [push]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: main
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.3.0
        with:
          # Updated to the new official image location
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          # Replace the URL below with your actual active ngrok URL from your terminal
          target: 'https://ngrok-free.dev'
          # Removed the missing rules file line to prevent file errors
          cmd_options: '-a'
