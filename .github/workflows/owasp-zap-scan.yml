name: OWASP ZAP Integration with GitHub Actions

on: [push]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: main
          
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.3.0
        with:
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'https://ngrok-free.dev' # Replace with your active ngrok URL
          cmd_options: '-a'
          
      # This step saves the report even when the scan fails with alerts
      - name: Upload ZAP Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: |
            zap_out.html
            zap_out.md
